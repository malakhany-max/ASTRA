components:
  schemas:
    Hub_AstronautSettingsRequest:
      properties:
        voice:
          type: boolean
          title: Voice
          default: true
        tone:
          type: string
          enum:
          - calm
          - warm
          - direct
          title: Tone
          default: calm
        language:
          type: string
          enum:
          - en
          - ar
          title: Language
          default: en
        checkinTime:
          type: string
          title: Checkintime
          default: '19:30'
        environment:
          type: string
          enum:
          - spacecraft
          - station
          - rover
          - base
          title: Environment
          default: spacecraft
        notifications:
          additionalProperties:
            type: boolean
          type: object
          title: Notifications
      type: object
      title: AstronautSettingsRequest
    Hub_Checkin:
      properties:
        astronaut_id:
          type: string
          title: Astronaut Id
        ts:
          type: string
          title: Ts
        mood:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Mood
        energy:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Energy
        dizziness:
          type: integer
          maximum: 3.0
          minimum: 0.0
          title: Dizziness
        workload:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Workload
        symptoms:
          items:
            type: string
          type: array
          title: Symptoms
        notes:
          type: string
          title: Notes
          default: ''
      additionalProperties: false
      type: object
      required:
      - astronaut_id
      - ts
      - mood
      - energy
      - dizziness
      - workload
      title: Checkin
    Hub_Consent:
      properties:
        astronaut_id:
          type: string
          title: Astronaut Id
        tiers:
          additionalProperties:
            type: boolean
          type: object
          title: Tiers
        emergency_override:
          type: boolean
          title: Emergency Override
      additionalProperties: false
      type: object
      required:
      - astronaut_id
      - tiers
      - emergency_override
      title: Consent
    Hub_DemoScenario:
      properties:
        name:
          type: string
          title: Name
      additionalProperties: false
      type: object
      required:
      - name
      title: DemoScenario
    Hub_HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/Hub_ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Hub_ManualReading:
      properties:
        astronaut_id:
          type: string
          title: Astronaut Id
        metric:
          type: string
          enum:
          - bp_systolic
          - bp_diastolic
          - blood_glucose
          title: Metric
        value:
          type: number
          title: Value
        unit:
          type: string
          title: Unit
        quality:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Quality
          default: 1.0
      additionalProperties: false
      type: object
      required:
      - astronaut_id
      - metric
      - value
      - unit
      title: ManualReading
    Hub_Reading:
      properties:
        schema:
          type: string
          const: astra.reading.v1
          title: Schema
        device_id:
          type: string
          minLength: 1
          title: Device Id
        astronaut_id:
          type: string
          minLength: 1
          title: Astronaut Id
        metric:
          type: string
          enum:
          - heart_rate
          - hrv_rmssd
          - spo2
          - skin_temp
          - sleep_duration
          - activity_level
          - bp_systolic
          - bp_diastolic
          - blood_glucose
          - dizziness_self_report
          - mood
          - dose_rate
          - cumulative_dose
          - neutron_dose_rate
          title: Metric
        value:
          type: number
          title: Value
        unit:
          type: string
          title: Unit
        ts:
          type: string
          title: Ts
        seq:
          type: integer
          minimum: 0.0
          title: Seq
        nonce:
          type: string
          pattern: ^[0-9a-f]{32}$
          title: Nonce
        source:
          type: string
          enum:
          - wearable
          - clinical_device
          - manual
          - dosimeter
          - area_monitor
          - self_report
          title: Source
        quality:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Quality
        sig:
          type: string
          minLength: 1
          title: Sig
      additionalProperties: false
      type: object
      required:
      - schema
      - device_id
      - astronaut_id
      - metric
      - value
      - unit
      - ts
      - seq
      - nonce
      - source
      - quality
      - sig
      title: Reading
    Hub_ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    GroundStation_Ack:
      properties:
        note:
          type: string
          title: Note
          default: ''
      type: object
      title: Ack
    GroundStation_Command:
      properties:
        command_type:
          type: string
          title: Command Type
          default: config_bundle
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - payload
      title: Command
    GroundStation_HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/GroundStation_ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    GroundStation_Login:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
      type: object
      required:
      - username
      - password
      title: Login
    GroundStation_ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Companion_HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/Companion_ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Companion_MessageRequest:
      properties:
        astronaut_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Astronaut Id
        text:
          type: string
          maxLength: 2100
          minLength: 1
          title: Text
        status_summary:
          items:
            $ref: '#/components/schemas/Companion_StatusSummary'
          type: array
          maxItems: 50
          title: Status Summary
        mode:
          type: string
          enum:
          - connected
          - autonomous
          title: Mode
          default: autonomous
        intent:
          anyOf:
          - type: string
            enum:
            - daily_checkin
            - breathing
            - weekly_wellbeing
            - radiation_followup
            - shelter_prompt
          - type: 'null'
          title: Intent
        dizziness_reported:
          type: boolean
          title: Dizziness Reported
          default: false
        tone:
          type: string
          enum:
          - warm
          - neutral
          - brief
          title: Tone
          default: warm
      type: object
      required:
      - astronaut_id
      - text
      title: MessageRequest
    Companion_StatusSummary:
      properties:
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema
        astronaut_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Astronaut Id
        indicator:
          type: string
          title: Indicator
        status:
          type: string
          enum:
          - normal
          - attention
          - urgent
          title: Status
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
        reasons:
          items:
            type: string
          type: array
          maxItems: 20
          title: Reasons
        baseline_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Baseline Ref
        recommended_action:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommended Action
        decision_level:
          anyOf:
          - type: integer
            maximum: 3.0
            minimum: 1.0
          - type: 'null'
          title: Decision Level
        computed_ts:
          anyOf:
          - type: string
          - type: 'null'
          title: Computed Ts
      type: object
      required:
      - indicator
      - status
      title: StatusSummary
    Companion_TTSRequest:
      properties:
        text:
          type: string
          maxLength: 2000
          minLength: 1
          title: Text
        voice:
          type: string
          maxLength: 64
          minLength: 1
          title: Voice
          default: default
        speaking_rate:
          type: number
          maximum: 1.5
          minimum: 0.7
          title: Speaking Rate
          default: 1.0
      type: object
      required:
      - text
      title: TTSRequest
    Companion_ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    LinkSimulator_DelayBody:
      properties:
        seconds:
          type: number
          maximum: 3600.0
          minimum: 0.0
          title: Seconds
      type: object
      required:
      - seconds
      title: DelayBody
    LinkSimulator_HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/LinkSimulator_ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LinkSimulator_ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived local Ground Station access token.
tags:
- name: Hub
- name: GroundStation
- name: Companion
- name: LinkSimulator
