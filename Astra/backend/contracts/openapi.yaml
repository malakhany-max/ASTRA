  x-shared-contract-schemas:
  - ./checkin.schema.json
  - ./consent.schema.json
  - ./envelope.schema.json
  - ./exposure_record.schema.json
  - ./integrity_result.schema.json
  - ./plan.schema.json
  - ./reading.schema.json
  - ./security_event.schema.json
  - ./status.schema.json
